<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ars</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <script>
        // Compose usa navigator.languages para elegir los recursos.
        const idiomasOriginales = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages").get;
        let idiomaArs;
        Object.defineProperty(navigator, "languages", {
            get: () => idiomaArs ? [idiomaArs] : idiomasOriginales.call(navigator)
        });

        window.cambiarIdiomaArs = (idioma) => {
            if (idiomaArs === idioma) return;
            idiomaArs = idioma;
            document.documentElement.lang = idioma;
            window.dispatchEvent(new Event("languagechange"));
        };
    </script>
</head>
<body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
